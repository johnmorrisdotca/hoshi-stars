name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      simulate_main_push:
        description: "Act as a push to main would: look for a green run of this workflow on the commit and skip the heavy jobs if there is one. For trying the lookup without touching main."
        type: boolean
        default: false
      lookup_sha:
        description: "With simulate_main_push: look for a green run on this commit instead (a dry run: the heavy jobs are skipped and the summary says what a push would do). Empty: this commit, and the heavy jobs follow the answer."
        type: string
        default: ""
permissions:
  contents: read
  actions: read
jobs:
  already-green:
    # A release runs this workflow on the release branch (by hand), then the fast-forward to main runs it again on the identical commit. On a push to main, ask GitHub whether a run
    # of this workflow already succeeded on this commit; if one did, the heavy jobs are skipped and the run is green. A failed, cancelled or unfinished run does not count, and
    # any other event (a pull request, a branch, a run by hand) always runs everything.
    name: A green run of this commit already exists?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.ask.outputs.skip }}
    steps:
      - id: ask
        env:
          GH_TOKEN: ${{ github.token }}
          SIMULATE: ${{ inputs.simulate_main_push }}
          LOOKUP_SHA: ${{ inputs.lookup_sha }}
          WORKFLOW_FILE: ci.yml
        run: |
          ask="no"
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then ask="yes"; fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$SIMULATE" = true ]; then ask="yes"; echo "Simulating a push to main."; fi
          if [ "$ask" = no ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Not a push to main ($GITHUB_EVENT_NAME on $GITHUB_REF): everything runs."
            exit 0
          fi
          sha="$GITHUB_SHA"
          dry=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$LOOKUP_SHA" ]; then sha="$LOOKUP_SHA"; dry=true; fi
          # Completed and successful, for this commit, other than this very run. Any other answer, or a failed question, means everything runs.
          if ! found="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?head_sha=$sha&status=completed&per_page=100" \
            --jq "[.workflow_runs[] | select(.conclusion == \"success\" and .id != $GITHUB_RUN_ID)] | length")"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Could not read the runs of $WORKFLOW_FILE: everything runs."
            exit 0
          fi
          echo "Runs of $WORKFLOW_FILE on $sha:"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW_FILE/runs?head_sha=$sha&per_page=100" --jq '.workflow_runs[] | "  \(.event) \(.status) \(.conclusion) \(.html_url)"' || true
          skip=false
          if [ "$found" -ge 1 ]; then
            echo "A successful run of $WORKFLOW_FILE exists for $sha."
            skip=true
          else
            echo "No successful run of $WORKFLOW_FILE for $sha."
          fi
          if [ "$dry" = true ]; then
            echo "A dry run (lookup_sha): a push to main with that commit would $([ "$skip" = true ] && echo 'skip the heavy jobs' || echo 'run everything'). The heavy jobs are skipped here whatever the answer."
            echo "A push to main with $sha would $([ "$skip" = true ] && echo 'skip the heavy jobs' || echo 'run everything')." >> "$GITHUB_STEP_SUMMARY"
            skip=true
          fi
          [ "$skip" = true ] && [ "$dry" = false ] && echo "The heavy jobs are skipped."
          [ "$skip" = false ] && echo "Everything runs."
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  check:
    needs: already-green
    if: needs.already-green.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  package:
    needs: already-green
    if: needs.already-green.outputs.skip != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The package as npm packs it installs and imports
        run: pnpm test:package
  demo:
    needs: already-green
    if: needs.already-green.outputs.skip != 'true'
    # One job a Playwright project: the four are the same tests at a desk's and a phone's width in Chromium and in WebKit.
    name: demo (${{ matrix.project }})
    runs-on: ubuntu-latest
    # In the Playwright image at the lockfile's version, which has the browsers' system libraries: no apt mirror (down on 2026-11-11).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    # The job has room for a slow apt mirror (on 2026-11-09 installing WebKit's system libraries took 12 to 15 minutes); the tests keep their own 15 minutes.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-desk, chromium-phone, webkit-desk, webkit-phone]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright
        with:
          browsers: ${{ startsWith(matrix.project, 'webkit') && 'webkit' || 'chromium' }}
      - name: The demo, played in one browser at one width (pnpm test:demo plays all four)
        run: pnpm test:demo:one --project=${{ matrix.project }}
        timeout-minutes: 15
  usage:
    needs: already-green
    if: needs.already-green.outputs.skip != 'true'
    runs-on: ubuntu-latest
    # In the Playwright image at the lockfile's version, which has the browsers' system libraries: no apt mirror (down on 2026-11-11).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - name: Every way of using the package, built and opened as npm packs it
        run: pnpm test:usage
  docs:
    needs: already-green
    if: needs.already-green.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The docs site builds, every example in the guides runs, every link leads somewhere
        run: pnpm docs:check
  readme:
    needs: already-green
    if: needs.already-green.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The README's and the guides' examples, run against the built package
        run: pnpm test:readme
  commits:
    # A pushed commit message never names an AI as author or co-author.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No AI attribution in the pushed commit messages
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          range="$BEFORE..HEAD"
          git cat-file -e "$BEFORE^{commit}" 2>/dev/null || range="HEAD~1..HEAD"
          if git log --format='%an %ae%n%cn %ce%n%B' "$range" | grep -i -E 'co-authored-by:.*(claude|anthropic|openai|chatgpt|gpt)|noreply@anthropic|noreply@openai'; then
            echo "A commit names an AI as author (see AGENTS.md: no AI attribution)"; exit 1
          fi
  freeze:
    needs: already-green
    if: needs.already-green.outputs.skip != 'true'
    # The constellation in 3D is WebGL: this plays it in Chromium, drawn in software, and fails on more than one frame asked for at a time, a draw when nothing moves, GPU objects that grow, or a canvas past its budget.
    name: freeze (WebGL)
    runs-on: ubuntu-latest
    # In the Playwright image at the lockfile's version, which has the browsers' system libraries: no apt mirror (down on 2026-11-11).
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright
        with:
          browsers: chromium
      - run: pnpm test:freeze
