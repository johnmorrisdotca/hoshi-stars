name: Release
# Run by hand (Actions → Release → Run workflow) from main, or push a v<version> tag. The steps are kazoku-ui's shared release workflow
# (docs/release-workflow.md there): check the tag, run the check below, tag, attach the tarball to a GitHub release, publish to npm by trusted publishing.
# npm trusts this file by name (npmjs.com → the package → Settings → Trusted Publisher: release.yml), so publishing needs no token and no secret.
# A version that is already on npm is skipped, so a placeholder or an earlier version does not stop a new one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  release:
    uses: johnmorrisdotca/kazoku-ui/.github/workflows/reusable-release.yml@v0.44.0
    with:
      github-release: true
      check-command: pnpm check && pnpm test:readme
      freeze-command: pnpm test:freeze
      require-ci-workflow: ci.yml
  data-files:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Check out the released tag
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          git fetch origin "refs/tags/v${version}:refs/tags/v${version}"
          git checkout --detach "v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm export:data
      - run: python3 -m venv "${RUNNER_TEMP}/venv" && "${RUNNER_TEMP}/venv/bin/pip" install pyarrow
      - run: |
          "${RUNNER_TEMP}/venv/bin/python" -I scripts/export-parquet.py dist-data
      - name: Attach the data files
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip -qr "${RUNNER_TEMP}/hoshi-stars-data-v${VERSION}.zip" dist-data
          gh release upload "v${VERSION}" "${RUNNER_TEMP}/hoshi-stars-data-v${VERSION}.zip" dist-data/*.csv dist-data/*.parquet dist-data/*.json dist-data/SHA256SUMS dist-data/LICENCE-DATA.md --clobber
