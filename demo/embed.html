<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'none'" />
    <title>Hoshi Stars embed</title>
    <meta name="robots" content="noindex" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; }
      #frame { position: relative; width: 100vw; height: 100vh; overflow: hidden; outline: none; cursor: grab; user-select: none; -webkit-user-select: none; }
      #frame:focus-visible { outline: 3px solid #ffd86b; outline-offset: -3px; }
      #frame svg { display: block; width: 100%; height: 100%; }
      #tools { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 6px; }
      #tools button { min-width: 44px; height: 44px; padding: 0 12px; border: 1px solid #46578c; border-radius: 8px; background: rgba(11, 16, 32, .85); color: #e8ecff; font: 600 1.1rem system-ui, sans-serif; cursor: pointer; }
      #tools button:hover { border-color: #e8ecff; }
      .dist-legend { position: absolute; left: 8px; bottom: 8px; margin: 0; padding: 6px 10px; list-style: none; background: rgba(11, 16, 32, .82); border: 1px solid #25304f; border-radius: 8px; color: #dfe5fa; font: .72rem/1.5 system-ui, sans-serif; pointer-events: none; max-width: calc(100% - 150px); }
      .dist-legend li { display: flex; align-items: center; gap: 6px; }
      .dist-legend .dist-count { margin-left: auto; padding-left: 10px; color: #9aa6c9; font-variant-numeric: tabular-nums; }
      .dist-swatch { width: 9px; height: 9px; border-radius: 50%; background: var(--swatch); flex: none; }
      .dist-swatch.ring { background: none; border: 1.5px solid var(--swatch); box-sizing: border-box; }
      .dist-unknown { color: #9aa6c9; }
      #tools button:focus-visible { outline: 3px solid #ffd86b; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="frame" data-testid="frame" tabindex="0" role="group">
      <div id="sky"></div>
      <div id="tools" role="group">
        <button type="button" id="zoom-in" data-testid="zoom-in">+</button>
        <button type="button" id="zoom-out" data-testid="zoom-out">&minus;</button>
        <button type="button" id="reset" data-testid="reset">&#8962;</button>
      </div>
    </div>
    <script type="module" src="js/embed.js"></script>
  </body>
</html>
