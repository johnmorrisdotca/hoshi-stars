<!doctype html>
<html lang="en">
  <head>
    <!--family:head-->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'" />
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="demo.css" />
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body>
    <main>
      <!--family:header-->
      <!--family:unreviewed-->
      <section class="clist" aria-labelledby="ls-heading">
        <h1 id="ls-heading" class="gl-title" data-testid="list-heading"></h1>
        <p class="lead" id="ls-lede"></p>
        <div class="fam-row"><span class="fam-label" id="ls-culture-label" data-say="culture"></span><span class="culture-row" id="ls-cultures" data-testid="cultures" role="group" aria-labelledby="ls-culture-label"></span></div>
        <div class="fam-row" id="ls-readings-row" hidden><button type="button" class="fam-button" id="ls-readings" data-testid="readings"></button></div>
        <form class="fam-row" id="ls-find" role="search" autocomplete="off" hidden>
          <label class="fam-label" for="ls-search" data-say="ls_search"></label>
          <input id="ls-search" type="search" class="fam-field" data-testid="list-search" enterkeyhint="search" />
        </form>
        <p class="fam-fine gl-mix" id="ls-mix" data-testid="list-mix" hidden></p>
        <div class="ls-bar" data-testid="list-filters" role="group" data-say-label="ls_filters">
          <div class="ls-chips" id="ls-chips"></div>
          <button type="button" class="fam-button ls-open" id="ls-open-sheet" data-testid="list-sheet-open"></button>
          <div class="ls-tally">
            <output class="ls-count" id="ls-count" data-testid="list-count" aria-live="polite"></output>
            <button type="button" class="fam-button" id="ls-clear" data-testid="list-clear" data-say="ls_clear"></button>
          </div>
        </div>
        <dialog class="ls-sheet" id="ls-sheet" data-testid="list-sheet" aria-labelledby="ls-sheet-title"></dialog>
        <p class="fam-fine" id="ls-empty" hidden></p>
        <div class="ls-scroll" id="ls-scroll" tabindex="0" role="region">
          <table class="ls-table" id="ls-table" data-testid="list-table"></table>
        </div>
      </section>
      <!--family:footer-->
    </main>
    <!--family:scripts-->
  </body>
</html>
