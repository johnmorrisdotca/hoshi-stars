<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'" />
    <title>Hoshi Stars: a star</title>
    <meta name="robots" content="noindex" />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; }
      body { display: grid; place-items: center; }
      #star { width: 100%; height: 100%; display: grid; place-items: center; }
      #star svg { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; }
      #star p { color: #c9d1ec; font: 1rem/1.4 system-ui, sans-serif; padding: 1rem; text-align: center; }
      #star.three { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; box-sizing: border-box; }
      #star.three .star3d-stage { width: min(100%, 72vh); aspect-ratio: 1; position: relative; }
      #star.three .star3d-tools { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
      #star.three .star3d-guide { font: 0.9rem system-ui, sans-serif; color: #e8ecfa; background: #1a2340; border: 1px solid #3a4670; border-radius: 8px; padding: 6px 14px; min-height: 36px; cursor: pointer; }
      #star.three .star3d-guide[aria-pressed="true"] { background: #e8ecfa; color: #0b1020; }
      #star.three p { padding: 0 1rem; margin: 0; font-size: 0.85rem; }
      #star.three .star3d-scale { width: min(100%, 72vh); }
      #star.three .star3d-scale svg { display: block; width: 100%; height: auto; }
      .star3d-rule { stroke: #8f9bc4; stroke-width: 0.4; }
      .star3d-sun { fill: #ffe9a8; }
    </style>
  </head>
  <body>
    <div id="star" data-testid="star" role="group"></div>
    <script type="module" src="js/star.js"></script>
  </body>
</html>
