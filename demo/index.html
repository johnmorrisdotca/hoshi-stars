<!doctype html>
<html lang="en">
  <head>
    <!--family:head-->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'none'" />
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="demo.css" />
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body>
    <main>
      <!--family:header-->
      <!--family:unreviewed-->
      <section class="sky" aria-labelledby="heading">
        <h2 id="heading" data-say="heading"></h2>
        <p class="lead" data-say="intro"></p>
        <div class="picker" id="picker" data-testid="picker">
          <div class="fam-row">
            <label class="fam-label" for="picker-search" data-say="pk_label"></label>
            <input id="picker-search" type="search" class="fam-field" data-testid="picker-search" autocomplete="off" enterkeyhint="search" />
            <a class="fam-button" href="constellations.html" data-pick-all></a>
          </div>
          <div class="picker-row">
            <span class="culture-stack" id="seg-culture" data-testid="cultures" role="group" data-say-label="culture"></span>
            <div class="picker-strip" id="picker-strip" data-testid="picker-strip" role="group" data-say-label="pk_label"></div>
          </div>
          <p class="fam-fine" id="culture-note" data-testid="culture-note" aria-live="polite"></p>
          <p class="fam-fine" data-pick-none data-say="pk_none" hidden></p>
        </div>
        <div class="sky-grid kazoku-stage">
          <div class="map-column kazoku-view">
            <div class="chart-box" id="chart-box">
              <svg id="chart" class="chart" data-testid="chart" role="img" tabindex="0" data-say-label="chartLabel"></svg>
              <div class="chart-tools" role="group" data-say-label="chartLabel">
                <button type="button" id="zoom-in" class="fam-button" data-testid="zoom-in" data-say="zoomIn"></button>
                <output id="zoom-readout" class="zoom-readout" data-testid="zoom-readout" aria-live="polite" data-say-label="zoomLevel"></output>
                <button type="button" id="zoom-out" class="fam-button" data-testid="zoom-out" data-say="zoomOut"></button>
                <button type="button" id="reset" class="fam-button" data-testid="reset" data-say="reset"></button>
              </div>
              <kazoku-wide-toggle id="wide-toggle" class="wide-toggle" address theme="dark" data-testid="wide-toggle"></kazoku-wide-toggle>
              <p class="under" id="under" data-testid="under" aria-hidden="true"></p>
            </div>
            <div class="controls">
              <div class="fam-row"><span class="fam-label" data-say="projection"></span><span class="fam-seg proj-seg" id="seg-projection" data-testid="projections" role="group" data-say-label="projection"></span></div>
              <div class="fam-row"><span class="fam-label" data-say="layers"></span><span class="fam-seg" id="seg-layers" data-testid="layers" role="group" data-say-label="layers"></span></div>
              <div class="fam-row"><label class="fam-label" for="from" data-say="viewFrom"></label><select id="from" class="fam-field" data-testid="from"></select></div>
              <p class="fam-fine" id="from-note" data-testid="from-note" aria-live="polite" hidden></p>
              <div class="fam-row"><label class="fam-label" for="magnitude" data-say="magnitude"></label><input id="magnitude" class="fam-range" data-testid="magnitude" type="range" min="2" max="6" step="0.5" value="5" /><output id="magnitude-out" class="fam-chip" for="magnitude"></output><span class="fam-fine" id="shown" data-testid="shown"></span></div>
              <p class="fam-fine faint-note" id="faint-note" data-testid="faint-note" aria-live="polite"></p>
            </div>
          </div>
          <div class="side kazoku-side">
            <form class="find" id="find" role="search" autocomplete="off">
              <h3 data-say="searchHeading"></h3>
              <div class="fam-row">
                <input id="search" type="search" class="fam-field" data-testid="search" data-say-label="search" data-say-placeholder="searchPlaceholder" enterkeyhint="search" />
                <button type="submit" class="fam-button" data-primary="true" data-testid="search-go" data-say="search"></button>
              </div>
              <div class="results" id="results" data-testid="results" role="listbox"></div>
              <p class="fam-fine" id="find-note" data-say="hint"></p>
            </form>
            <div class="picked" id="picked" data-testid="picked" aria-live="polite"></div>
            <div class="picked nearby" id="nearby" data-testid="nearby" aria-live="polite"></div>
          </div>
        </div>
      </section>
      <section class="more" aria-labelledby="code-heading">
        <h2 id="code-heading" data-say="codeHeading"></h2>
        <div class="fam-row"><span class="fam-label" data-say="embedWhat"></span><span class="fam-seg" id="seg-embed-what" data-testid="embed-what" role="group" data-say-label="embedWhat"></span><span class="fam-fine" id="embed-what-hint" data-say="embedHint"></span></div>
        <kazoku-embed-panel id="embed-panel" data-testid="embed-panel" sizes="320 480 640" size="480"></kazoku-embed-panel>
      </section>
      <!--family:footer-->
    </main>
    <!--family:scripts-->
  </body>
</html>
