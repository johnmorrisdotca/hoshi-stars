<!doctype html>
<html lang="en">
  <head>
    <!--family:head-->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'none'" />
    <link rel="stylesheet" href="family.css" />
    <link rel="stylesheet" href="demo.css" />
  </head>
  <body>
    <main>
      <!--family:header-->
      <!--family:unreviewed-->
      <section class="kids" aria-labelledby="kids-heading">
        <h1 id="kids-heading" class="kids-title" data-say="kd_heading"></h1>
        <p class="lead" data-say="kd_lede"></p>
        <div class="kids-picks">
          <div class="fam-row"><span class="fam-label" data-say="kd_kind"></span><span class="fam-seg" id="kinds" role="group" data-say-label="kd_kind"></span></div>
          <div class="fam-row" id="row-where">
            <span class="fam-label" data-say="kd_where"></span>
            <label class="field"><span data-say="kd_country"></span><select id="country" class="fam-field"></select></label>
            <label class="field" id="field-region" hidden><span data-say="kd_region"></span><select id="region" class="fam-field"></select></label>
            <button type="button" class="fam-button" id="here" data-say="kd_here"></button>
            <label class="field"><span data-say="kd_latitude"></span><input id="lat" class="fam-range" type="range" min="-70" max="70" step="0.1" /></label>
            <output id="lat-out" class="fam-fine"></output>
            <img id="flag" class="kids-flag" alt="" hidden />
          </div>
          <p class="fam-fine" id="where-note" role="status"></p>
          <div class="fam-row" id="row-level"><span class="fam-label" data-say="kd_level"></span><span class="fam-seg" id="levels" role="group" data-say-label="kd_level"></span></div>
          <div class="fam-row" id="row-which"><span class="fam-label" data-say="kd_which"></span><span class="fam-seg kids-seg" id="whiches" role="group" data-say-label="kd_which"></span><label class="field"><span data-say="kd_more"></span><select id="more" class="fam-field"></select></label></div>
          <div class="fam-row" id="row-month"><span class="fam-label" data-say="kd_month"></span><span class="fam-seg kids-seg" id="months" role="group" data-say-label="kd_month"></span></div>
          <div class="fam-row" id="row-form"><span class="fam-label" data-say="kd_form"></span><span class="fam-seg" id="forms" role="group" data-say-label="kd_form"></span></div>
          <div class="fam-row"><span class="fam-label" data-say="kd_paper"></span><span class="fam-seg" id="papers" role="group" data-say-label="kd_paper"></span><span class="fam-label" data-say="kd_type"></span><span class="fam-seg" id="types" role="group" data-say-label="kd_type"></span>
            <button type="button" class="fam-button" id="print" data-primary="true"></button></div>
        </div>
        <p class="fam-fine" id="info" role="status"></p>
        <p class="fam-fine"><span data-say="kd_pdfs"></span> <a id="pdfs" href="pdf/" data-say="kd_pdflink"></a></p>
        <p class="fam-fine"><span data-say="kd_gallery"></span> <a id="kids-gallery" href="constellations.html?culture=chinese&amp;readings=on" data-testid="kids-gallery" data-say="kd_gallerylink"></a></p>
        <div id="paper" class="kids-paper" role="group" data-say-label="kd_preview"><div id="paper-inner"></div></div>
      </section>
      <!--family:footer-->
    </main>
    <!--family:scripts-->
  </body>
</html>
